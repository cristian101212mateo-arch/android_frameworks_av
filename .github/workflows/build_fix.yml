name: Build Patched Libaudioclient for A55X

on:
  push:
    branches: [ lineage-23.2 ]
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
    - name: Checkout My Fork (Patched Source)
      uses: actions/checkout@v4
      with:
        path: my_fork

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git python3 repo bc bison flex gperf zlib1g-dev \
          libncurses5-dev libssl-dev lzop pngcrush schedtool squashfs-tools \
          rsync unzip zip openjdk-17-jdk ccache
        
        git config --global user.email "cristian101212mateo@gmail.com"
        git config --global user.name "cristian101212mateo-arch"

    - name: Setup Workspace & Sync Official Sources
      run: |
        mkdir -p workspace/src
        cd workspace/src
        
        # Inicializamos el manifest OFICIAL de LineageOS 23.2
        # Esto garantiza que tengamos todos los headers de frameworks/native, system/core, etc.
        repo init -u https://github.com/LineageOS/android.git \
                   -b lineage-23.2 \
                   --depth=1 \
                   --no-tags

        # Sincronizamos SOLO lo necesario para compilar frameworks/av
        repo sync -c -j8 --no-tags --no-clone-bundle \
          frameworks/av \
          frameworks/native \
          system/core \
          build/make \
          build/soong \
          prebuilts/clang/host/linux-x86 \
          prebuilts/build-tools \
          prebuilts/jdk/jdk21 \
          external/zlib \
          external/libcxx \
          external/icu \
          hardware/interfaces \
          system/security \
          system/logging

    - name: Apply My Patch to Official Sources
      run: |
        echo "--- Overwriting official AudioSystem.cpp with my patched version ---"
        
        # Copiamos MI archivo parcheado encima del oficial sincronizado
        cp $GITHUB_WORKSPACE/my_fork/media/libaudioclient/AudioSystem.cpp \
           workspace/src/frameworks/av/media/libaudioclient/AudioSystem.cpp
        
        # Verificación crítica: ¿Está el parche ahí?
        if grep -q "PATCH A55X FREE SAM" workspace/src/frameworks/av/media/libaudioclient/AudioSystem.cpp; then
            echo "✅ Parche aplicado correctamente."
        else
            echo "❌ ERROR: El parche NO se encontró."
            exit 1
        fi

    - name: Configure Build Environment
      run: |
        cd workspace/src
        source build/envsetup.sh
        
        # Target genérico ARM64. libaudioclient.so es estándar para todos.
        lunch lineage_aosp_arm64-userdebug
        
        export ALLOW_MISSING_DEPENDENCIES=true
        export USE_CCACHE=1
        export CCACHE_DIR=/home/runner/.ccache

    - name: Compile Libaudioclient
      run: |
        cd workspace/src
        mka libaudioclient -j8

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libaudioclient_patched_A55X
        path: workspace/src/out/target/product/aosp_arm64/system/lib64/libaudioclient.so
        retention-days: 7
